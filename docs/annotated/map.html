<!doctype html>
<!-- 표준 HTML 문서로 해석하도록 선언함. 실제 화면 내용은 body에 둠. -->
<html lang="ko">
<!-- lang="ko"는 문서의 기본 언어가 한국어임을 알림. -->
<head>
  <!-- 한글을 포함한 문자를 UTF-8 인코딩으로 읽음. -->
  <meta charset="UTF-8">
  <!-- 화면을 표시할 기준 폭과 초기 배율을 지정함. 배치 자체는 CSS가 정함. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 검색 서비스 등에 제공할 설명임. 본문에 직접 표시되는 글자는 아니며, 화면의 안내 문장은 map.js가 따로 만듦. -->
  <meta name="description" content="감상한 영화의 제작 국가를 세계 지도 위의 핀으로 확인합니다.">
  <!-- 브라우저 탭의 초기 제목임. boot()가 map.js에서 넘긴 '영화 지도'로 다시 지정하므로 두 값을 같게 맞춤. -->
  <title>영화 지도</title>
  <!-- 파비콘은 브라우저 탭에 사용하는 아이콘임. 본문의 세계 지도나 포스터 이미지와는 별개임. -->
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
  <!-- 메인·캘린더와 같은 CSS를 연결해 글꼴, 메뉴, 버튼 모양을 통일함. -->
  <link rel="stylesheet" href="css/common.css">
  <!-- 지도 페이지에만 쓰는 스타일을 별도 파일로 분리함. common.css 다음에 연결하므로 선택자 명시도가 같으면 나중에 읽은 map.css 규칙이 적용됨. -->
  <link rel="stylesheet" href="css/map.css">
  <!--
    map.html은 공통 HTML 틀이고 실제 본문은 아래 JS가 만듦.
    map.js가 보기 전환 버튼·세계 지도와 국가별 핀·선택한 국가의 영화 목록·국가 순위를 만들고 상세 페이지 링크를 연결함.
    type="module"은 import/export를 사용하는 모듈로 실행한다는 뜻임.
    async 속성이 없는 모듈 스크립트이므로 HTML 해석이 끝난 뒤 실행되어 #app 등을 찾을 수 있음.
    src는 HTML 기준 경로이고, JS 내부 import의 경로는 해당 JS 파일 기준임.
    map.js가 img에 넣는 'assets/world-map.jpg'는 import가 아니므로 이 HTML 문서 기준 경로로 해석됨.
  -->
  <script type="module" src="js/pages/map.js"></script>
</head>
<body>
  <!-- 같은 문서의 id="app" 영역으로 이동함. 메인 페이지를 다시 여는 링크가 아님. -->
  <a href="#app" class="skip-link">본문으로 바로가기</a>
  <!-- ui.js의 mountShell()이 공통 메뉴(nav와 링크들)를 넣을 빈 자리임. -->
  <aside id="sidebar"></aside>
  <!-- 상단 안내, 본문, 하단 안내를 한 묶음으로 관리하는 일반 div임. -->
  <div class="main-wrap">
    <!-- boot()가 저장 위치 안내를 채우며, #messages도 이곳으로 옮김. -->
    <header id="topbar"></header>
    <!--
      map.js의 renderMap()이 완성한 요소들을 이 안에 넣음.
      tabindex="-1"은 일반 Tab 이동 순서에서 빼되 코드 등으로 초점을 줄 수 있게 함.
      핀·순위·보기 전환 버튼을 눌러 본문을 다시 그려도 main 자체는 남고 그 안의 자식 요소만 교체됨.
    -->
    <main id="app" tabindex="-1"></main>
    <!-- CSS에서 가운데 정렬하는 공통 하단 안내임. -->
    <footer>
      <!-- &copy;는 화면에 © 문자로 표시하는 HTML 문자 참조임. -->
      <p>&copy; 2026 32조. 팀프로젝트.</p>
      <!-- 예시 연락처를 글자로 표시함. 자동 메일 전송 기능은 없음. -->
      <p>대표 이메일: teamproject@example.com</p>
    </footer>
  </div>
  <!--
    showMessage()가 저장 성공이나 오류 문구를 넣음. hidden으로 처음에는 숨김.
    지도 페이지는 저장 기능이 없으므로 감상 기록을 읽거나 화면을 그리지(다시 그리지) 못했을 때의 오류 문구가 주로 표시됨.
    role="status"와 aria-live="polite"는 내용 변경을 화면 읽기 프로그램에 알리는 설정임.
    이 영역은 boot()가 상단 안내 쪽으로 옮겨 페이지 위쪽에 보이도록 함.
  -->
  <div id="messages" role="status" aria-live="polite" hidden></div>
  <!-- JS가 꺼져 있을 때의 안내임. JS 실행 오류를 자동으로 대신 표시하는 요소는 아님. -->
  <noscript>이 웹사이트는 JavaScript를 켜야 사용할 수 있습니다.</noscript>
</body>
</html>
