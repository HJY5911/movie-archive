<!doctype html>
<!-- 표준 HTML 문서로 해석하도록 선언함. 실제 화면 내용은 body에 둠. -->
<html lang="ko">
<!-- lang="ko"는 문서의 기본 언어가 한국어임을 알림. -->
<head>
  <!-- 한글을 포함한 문자를 UTF-8 인코딩으로 읽음. -->
  <meta charset="UTF-8">
  <!-- 화면을 표시할 기준 폭과 초기 배율을 지정함. 배치 자체는 CSS가 정함. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 검색 서비스 등에 제공할 설명임. 본문에 직접 표시되는 글자는 아니며, 화면의 안내 문장은 archive.js가 따로 만듦. -->
  <meta name="description" content="감상한 영화의 티켓과 특전 포스터 사진을 영화별로 보관하고 모아 봅니다.">
  <!-- 브라우저 탭의 초기 제목임. boot()가 archive.js에서 넘긴 '사진 보관함'으로 다시 지정하므로 두 값을 같게 맞춤. -->
  <!-- ui.js의 공통 메뉴에 이미 '사진 보관함' → archive.html 링크가 있으므로 메뉴 이름과도 같게 맞춤. -->
  <title>사진 보관함</title>
  <!-- 파비콘은 브라우저 탭에 사용하는 아이콘임. 보관한 사진과는 별개임. -->
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
  <!-- 다른 페이지와 같은 CSS를 연결해 글꼴, 메뉴, 버튼 모양을 통일함. -->
  <!-- 사진 카드 모양(media-grid, media-card)도 common.css에 있어 영화 상세 페이지의 사진 목록과 같은 모양이 됨. -->
  <link rel="stylesheet" href="css/common.css">
  <!-- 보관함 페이지에만 쓰는 스타일을 별도 파일로 분리함. common.css 다음에 연결하므로 선택자 명시도가 같으면 나중에 읽은 archive.css 규칙이 적용됨. -->
  <link rel="stylesheet" href="css/archive.css">
  <!--
    archive.html은 공통 HTML 틀이고 실제 본문은 아래 JS가 만듦.
    archive.js가 사진 올리기 폼(파일 선택·미리보기·종류 선택·영화 찾기)·영화별 사진 목록·종류 필터·크게 보기 창을 만듦.
    type="module"은 import/export를 사용하는 모듈로 실행한다는 뜻임.
    async 속성이 없는 모듈 스크립트이므로 HTML 해석이 끝난 뒤 실행되어 #app 등을 찾을 수 있음.
    src는 HTML 기준 경로이고, JS 내부 import의 경로는 해당 JS 파일 기준임.
    영화 상세 페이지(movie.html)의 '사진 보관함' 링크는 archive.html?movie_id=영화ID 형식이며, archive.js가 이 값을 읽어 영화를 미리 선택함.
  -->
  <script type="module" src="js/pages/archive.js"></script>
</head>
<body>
  <!-- 같은 문서의 id="app" 영역으로 이동함. 메인 페이지를 다시 여는 링크가 아님. -->
  <a href="#app" class="skip-link">본문으로 바로가기</a>
  <!-- ui.js의 mountShell()이 공통 메뉴(nav와 링크들)를 넣을 빈 자리임. -->
  <aside id="sidebar"></aside>
  <!-- 상단 안내, 본문, 하단 안내를 한 묶음으로 관리하는 일반 div임. -->
  <div class="main-wrap">
    <!-- boot()가 저장 위치 안내를 채우며, #messages도 이곳으로 옮김. -->
    <header id="topbar"></header>
    <!--
      archive.js의 renderArchive()가 완성한 요소들을 이 안에 넣음.
      tabindex="-1"은 일반 Tab 이동 순서에서 빼되 코드 등으로 초점을 줄 수 있게 함.
      사진을 저장하거나 삭제해 본문을 다시 그려도 main 자체는 남고 그 안의 자식 요소만 교체됨.
      크게 보기 창(dialog)도 이 안에 함께 만들어짐. HTML 틀은 다른 페이지와 똑같이 유지함.
    -->
    <main id="app" tabindex="-1"></main>
    <!-- CSS에서 가운데 정렬하는 공통 하단 안내임. -->
    <footer>
      <!-- &copy;는 화면에 © 문자로 표시하는 HTML 문자 참조임. -->
      <p>&copy; 2026 32조. 팀프로젝트.</p>
      <!-- 예시 연락처를 글자로 표시함. 자동 메일 전송 기능은 없음. -->
      <p>대표 이메일: teamproject@example.com</p>
    </footer>
  </div>
  <!--
    showMessage()가 저장 성공이나 오류 문구를 넣음. hidden으로 처음에는 숨김.
    보관함 페이지에서는 사진 저장·삭제 결과와 파일 검사 오류(예: '사진 한 장은 5 MiB 이하여야 합니다.')가 표시됨.
    role="status"와 aria-live="polite"는 내용 변경을 화면 읽기 프로그램에 알리는 설정임.
    이 영역은 boot()가 상단 안내 쪽으로 옮겨 페이지 위쪽에 보이도록 함.
  -->
  <div id="messages" role="status" aria-live="polite" hidden></div>
  <!-- JS가 꺼져 있을 때의 안내임. JS 실행 오류를 자동으로 대신 표시하는 요소는 아님. -->
  <noscript>이 웹사이트는 JavaScript를 켜야 사용할 수 있습니다.</noscript>
</body>
</html>
